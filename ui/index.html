<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>KC 设置</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    label { display: block; margin: 10px 0 4px; }
    input, button { font-size: 14px; }
    input { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h2>KC 设置</h2>
  <label>LLM API Key</label>
  <input id="apiKey" type="password" placeholder="sk-..." />
  <label>扫描间隔（毫秒）</label>
  <input id="scanIntervalMs" type="number" />
  <label>知识库目录</label>
  <input id="knowledgeDir" type="text" />
  <label><input id="autostart" type="checkbox" /> 开机自启</label>
  <p><button id="save">保存</button> <button id="cancel">取消</button></p>
  <script type="module">
    const { invoke } = window.__TAURI__.core;
    (async () => {
      try {
        const s = await invoke('get_settings');
        document.getElementById('apiKey').value = s.EXTRACT_LLM_API_KEY || '';
        document.getElementById('scanIntervalMs').value = s.KC_SCAN_INTERVAL_MS || 60000;
        document.getElementById('knowledgeDir').value = s.KC_KNOWLEDGE_DIR || '';
        document.getElementById('autostart').checked = !!s.autostart;
      } catch (e) { console.error(e); }
    })();
    document.getElementById('save').onclick = async () => {
      const settings = {
        EXTRACT_LLM_API_KEY: document.getElementById('apiKey').value,
        KC_SCAN_INTERVAL_MS: Number(document.getElementById('scanIntervalMs').value) || 60000,
        KC_KNOWLEDGE_DIR: document.getElementById('knowledgeDir').value,
        autostart: document.getElementById('autostart').checked,
      };
      await invoke('save_settings', { settings });
      window.close();
    };
    document.getElementById('cancel').onclick = () => window.close();
  </script>
</body>
</html>
